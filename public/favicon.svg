<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Left Twintail -->
  <path d="M 8 12 C 4 14, 2 18, 2 24 C 2 28, 4 30, 6 30 C 7 30, 7.5 28, 7 24 C 6.5 20, 7.5 16, 9 13 Z" fill="#39c5bb"/>
  <path d="M 6.5 15 C 4 19, 3.5 24, 4.5 28 C 3.5 27, 3 24, 3.5 20 C 4 17, 5.5 15, 6.5 15 Z" fill="#2ea89f"/>

  <!-- Right Twintail -->
  <path d="M 24 12 C 28 14, 30 18, 30 24 C 30 28, 28 30, 26 30 C 25 30, 24.5 28, 25 24 C 25.5 20, 24.5 16, 23 13 Z" fill="#39c5bb"/>
  <path d="M 25.5 15 C 28 19, 28.5 24, 27.5 28 C 28.5 27, 29 24, 28.5 20 C 28 17, 26.5 15, 25.5 15 Z" fill="#2ea89f"/>

  <!-- Left Hair Tie (Black square + Magenta rim) -->
  <rect x="6.5" y="10" width="3.5" height="3.5" rx="0.5" fill="#1f2335"/>
  <rect x="7" y="10.5" width="2.5" height="1" fill="#f7768e"/>

  <!-- Right Hair Tie (Black square + Magenta rim) -->
  <rect x="22" y="10" width="3.5" height="3.5" rx="0.5" fill="#1f2335"/>
  <rect x="22.5" y="10.5" width="2.5" height="1" fill="#f7768e"/>

  <!-- Head / Face -->
  <circle cx="16" cy="16" r="7.5" fill="#ffebd9"/>

  <!-- Headset on left side with mic -->
  <rect x="7.5" y="14" width="2" height="4.5" rx="1" fill="#1f2335"/>
  <circle cx="8.5" cy="16" r="0.8" fill="#f7768e"/>
  <path d="M 8.5 17 Q 10 20 13 20" stroke="#1f2335" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <circle cx="13" cy="20" r="0.7" fill="#f7768e"/>

  <!-- Headset on right side -->
  <rect x="22.5" y="14" width="2" height="4.5" rx="1" fill="#1f2335"/>
  <circle cx="23.5" cy="16" r="0.8" fill="#f7768e"/>

  <!-- Hair Base (Top dome) -->
  <path d="M 8.5 16 C 8.5 10, 11 6, 16 6 C 21 6, 23.5 10, 23.5 16 C 23.5 12, 21 8, 16 8 C 11 8, 8.5 12, 8.5 16 Z" fill="#39c5bb"/>

  <!-- Front Bangs -->
  <path d="M 8.5 15 C 10 13, 11 11, 13 14 C 13.5 11, 15 11, 16 13 C 17 11, 18.5 11, 19 14 C 21 11, 22 13, 23.5 15 C 23 10, 20.5 7, 16 7 C 11.5 7, 9 10, 8.5 15 Z" fill="#39c5bb"/>
  <!-- Bangs highlight -->
  <path d="M 11 9 C 13 8.2, 19 8.2, 21 9 C 19.5 8.6, 12.5 8.6, 11 9 Z" fill="#78eae1"/>

  <!-- Eyes -->
  <ellipse cx="13" cy="16.5" rx="1.2" ry="1.6" fill="#1b7a73"/>
  <circle cx="12.6" cy="15.8" r="0.5" fill="#ffffff"/>
  <circle cx="13.4" cy="17.2" r="0.3" fill="#6fe3db"/>

  <ellipse cx="19" cy="16.5" rx="1.2" ry="1.6" fill="#1b7a73"/>
  <circle cx="18.6" cy="15.8" r="0.5" fill="#ffffff"/>
  <circle cx="19.4" cy="17.2" r="0.3" fill="#6fe3db"/>

  <!-- Subtle Blush -->
  <ellipse cx="11.5" cy="18.5" rx="1.2" ry="0.6" fill="#f7768e" opacity="0.45"/>
  <ellipse cx="20.5" cy="18.5" rx="1.2" ry="0.6" fill="#f7768e" opacity="0.45"/>

  <!-- Smile -->
  <path d="M 15 19.2 Q 16 20.2 17 19.2" stroke="#d47055" stroke-width="0.8" fill="none" stroke-linecap="round"/>
</svg>
