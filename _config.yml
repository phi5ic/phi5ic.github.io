# Site Settings
title: "phi5ic (Aravind Anilraj)"
name: "Aravind Anilraj"
description: "Technical writing on storage systems, distributed computing, and other fun stuff"
url: "https://phi5ic.github.io"
baseurl: ""

# Theme settings
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "catppuccin_mocha"

# plugins
plugins:
  - jekyll-include-cache

# Site Author (for sidebar)
author:
  name: "phi5ic (Aravind Anilraj)"
  bio: "Building Nifsi, a distributed OS layer, and a Linux contributor."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/phi5ic"

# Pagination
paginate: 5
paginate_path: "/page:num/"

# Exclude from processing
# _config.yml
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .git
  - .github
  - _site
  - README.md
  - benchmark_results.json
  - BENCHMARK_SCIENTIFIC_REPORT.md
  - .txt
# Defaults for posts (optional but recommended)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
