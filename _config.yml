# Site Settings
title: "phi5ic (Aravind Anilraj)"
name: "Aravind Anilraj"
description: "Technical writing on storage systems, distributed computing, and other fun stuff"
url: "https://phi5ic.github.io"
baseurl: ""

# Theme settings
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "catppuccin_mocha"

# plugins
plugins:
  - jekyll-include-cache

# Search
search: true
search_full_content: true

# Include custom directories
include:
  - _pages

# Site Author (for sidebar)
author:
  name: "Aravind Anilraj"
  avatar: "https://github.com/phi5ic.png"
  bio: "Building Nifsi, a distributed OS layer, and a Linux contributor."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/phi5ic"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:aravindanilraj0702@gmail.com"

# Pagination
paginate: 5
paginate_path: "/page:num/"

# Exclude from processing
# _config.yml
exclude:
  - bin
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .git
  - .github
  - _site
  - README.md
  - benchmark_results.json
  - BENCHMARK_SCIENTIFIC_REPORT.md
  - .txt
# Defaults for posts (optional but recommended)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true
      toc_label: "On This Page"
      toc_icon: "list-ul"
  - scope:
      path: "_pages"
    values:
      layout: single
      author_profile: true
